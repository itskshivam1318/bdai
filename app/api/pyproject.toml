[project]
name = "aivar-api"
version = "0.1.0"
description = "Backend for the autonomous QA agent hackathon prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "playwright>=1.49",
    "anthropic>=0.40",
    "pillow>=11.0",
    "numpy>=2.1",
    "google-genai>=2.22.0",
    "arize-phoenix>=20.7.0",
    "openinference-instrumentation-google-genai>=1.4.4",
    "openinference-instrumentation-anthropic>=2.1.1",
]

[tool.uv]
package = false
